<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>390px 视口模拟</title>
<style>
  html, body { margin: 0; background: #dfe3f0; }
  /* 用固定 390x844 的 iframe 当“手机画框”，绕开 headless 窗口 526px 最小宽度 */
  #f { width: 390px; height: 844px; border: 0; display: block; margin: 0; }
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
(function () {
  const step = new URLSearchParams(location.search).get('state') || '';
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const f = document.getElementById('f');

  function fire(win, target, type) {
    target.dispatchEvent(new win.PointerEvent(type, {
      bubbles: true, cancelable: true, pointerId: 1, pointerType: 'touch',
      isPrimary: true, clientX: 195, clientY: 200,
      buttons: type === 'pointerup' ? 0 : 1,
    }));
  }

  (async function () {
    f.src = 'index.html' + (step ? '?state=' + step : '');
    await new Promise((r) => (f.onload = r));
    await sleep(400);
    const d = f.contentDocument;
    const w = f.contentWindow;
    const vw = d.documentElement.clientWidth;
    const wide = [];
    d.querySelectorAll('*').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.width > vw + 0.5 || r.right > vw + 0.5) {
        wide.push((el.id || el.className || el.tagName) + ' w=' + Math.round(r.width) +
                  ' right=' + Math.round(r.right));
      }
    });
    const card = d.getElementById('timerCard').getBoundingClientRect();
    document.title = 'DIAG:视口=' + vw + ' scrollWidth=' + d.documentElement.scrollWidth +
      ' 计时卡=' + Math.round(card.width) + 'px(right=' + Math.round(card.right) + ')' +
      ' 超宽元素=' + (wide.length ? wide.slice(0, 6).join(' ; ') : '无');

    // 若要求“按住准备”状态，则合成触摸并保持
    if (step === 'hold') {
      fire(w, d.getElementById('timerCard'), 'pointerdown');
    }
  })();
})();
</script>
</body>
</html>
